*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}

main{max-width:760px;margin:0 auto;padding:14px 16px}

.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700}

.scroll{overflow-x:auto}

th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}

.yes{color:var(--ok);font-weight:800}
input[type=search],input[type=number],select,textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
label{display:block;font-weight:700;margin:12px 0 4px}

ul.tips{padding-left:20px;margin:8px 0 0}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.msg{color:var(--muted);font-size:.9rem;margin-top:6px}

::view-transition-old(art){display:none}
::view-transition-new(art){animation:none}
::view-transition-group(*){animation-duration:.95s;animation-timing-function:cubic-bezier(.65,0,.2,1)}
::view-transition-old(*),::view-transition-new(*){animation-duration:.95s}
.today{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"days" "hero" "list";gap:12px;align-items:start}
.today>*{margin:0}

}

<body>
<div id="art" aria-hidden="true"></div>
<header class="top"><div class="in"><h1>Workout</h1><div class="chips" id="themes" role="group" aria-label="Theme"></div></div></header>
<nav id="nav" aria-label="Sections"></nav>
<main id="app"></main>
<footer><p>General fitness information, not medical advice. Stop if you feel pain, and check with a professional if you have injuries or health concerns.</p></footer>
<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const PLAN=[
["Glute activation",["Glute bridge","Donkey kick (each side = 1)","Fire hydrant (each side = 1)","Clamshell (each side = 1)","Chair squat"]],
["Legs and glutes",["Chair squat","Reverse lunge (hold a wall)","Sumo squat","Low step-up (each side = 1)","Glute bridge"]],
["Bridge and thrust day",["Glute bridge","Marching bridge","Hip thrust (shoulders on sofa)","Frog pump","Bird dog"]],
["Light core and upper",["Wall push-up","Dead bug","Bird dog","Side-lying leg lift (each side = 1)","Pelvic tilt"]],
["Glute strength",["Hip thrust (shoulders on sofa)","Hip hinge (bodyweight)","Sumo squat","Curtsy lunge (hold a wall)","Standing kickback (each side = 1)"]],
["Glute finisher mix",["Glute bridge","Donkey kick (each side = 1)","Fire hydrant (each side = 1)","Chair squat","Side step (small steps, soft knees)"]],
["Rest",[]]];
const PROG=[
[1,8,"2 sec down, 2 sec up","None. Learn the movements."],
[2,10,"2 sec down, 2 sec up","None."],
[3,12,"2 sec down, 2 sec up","Add a 2-second squeeze at the top of bridges, thrusts and kicks."],
[4,12,"3 sec down, 1 sec up","Optional: mini loop band above knees, or hold a backpack on bridges and squats."]];
const CUES={
"Glute bridge":"Lie on your back, knees bent, feet hip-width. Press through your heels and lift until shoulders, hips and knees line up. Squeeze at the top; don’t arch your lower back.",
"Hip thrust":"Upper back resting on a stable sofa edge, feet flat. Drive through your heels, tuck your chin and lift until hips are level with your knees. Lower with control.",
"Donkey kick":"On hands and knees with a flat back. Keep the knee bent and press your heel toward the ceiling without arching or rotating your hips.",
"Fire hydrant":"On hands and knees. Lift one knee out to the side, keeping hips square. Go only as high as your hips stay level.",
"Clamshell":"Lie on your side, knees bent, feet together. Open the top knee without rolling your hips back, then close slowly.",
"Frog pump":"Lie on your back with soles of your feet together and knees dropped open. Lift hips and squeeze glutes at the top.",
"Chair squat":"Sit back toward the chair with chest tall and knees tracking over toes. Lightly tap the seat and stand. 2 seconds down, 2 seconds up.",
"Sumo squat":"Wide stance, toes turned out slightly. Sit down between your feet, knees over toes, then squeeze your glutes as you stand.",
"Reverse lunge":"Hold a wall for balance. Step back with control, keep your front heel planted and torso tall. Push through the front heel to return.",
"Curtsy lunge":"Hold a wall for balance. Step diagonally behind you with control, keep your front heel planted and torso tall. Push through the front heel to return.",
"Low step-up":"Use a low, stable step. Place your whole foot on it and push through that heel to stand. Lower slowly.",
"Hip hinge":"Push hips back with soft knees and a flat back, like closing a car door with your backside. Feel the stretch in the back of your thighs.",
"Standing kickback":"Hold a wall. Keep your torso tall and kick one leg straight back a short distance, squeezing the glute without leaning forward.",
"Bird dog":"Keep hips level and back flat as you reach the opposite arm and leg out. Move slowly; don’t let your torso twist.",
"Dead bug":"Press your lower back gently into the floor as you extend the opposite arm and leg. Stop before your back lifts.",
"Marching bridge":"Hold a glute bridge with hips level. Lift one foot slightly, then lower it and switch. Keep your hips from dropping or rocking.",
"Wall push-up":"Hands on the wall at chest height, body in one straight line from head to heels. Lower until your nose is near the wall, then press back.",
"Pelvic tilt":"Lie on your back with knees bent. Gently flatten your lower back into the floor by tucking your tailbone, hold a second, then release.",
"Side-lying leg lift":"Lie on your side with your body in a line. Lift the top leg slightly behind your hip line, toes forward, then lower slowly. Don’t roll back.",
"Side step":"Soft knees, hips back a little, chest tall. Take small controlled steps sideways, keeping toes forward and your feet from clicking together."};
const base=n=>n.replace(/\s*\(.*\)\s*/,"").trim();
const cueFor=n=>CUES[base(n)]||"";
const TIPS=["Warm up for 2-3 minutes first: marching in place, hip circles, a few easy bodyweight squats.","Feel the work in your glutes, not your lower back or knees. If you don’t, slow down and reduce range.","Squeeze your glutes for 1-2 seconds at the top of bridges, thrusts and kicks.","Glute growth needs gradual progress: follow the progression, eat enough protein and sleep well.","Stop a round early if form slips: a clean 6 reps beats a sloppy 10."];
const KEY="glute-focus-v1";
let S={goal:5,week:1,logs:{}};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&typeof p==="object")S=Object.assign(S,p)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab="today",sel=(new Date().getDay()+6)%7,open=null,io="";
const el=document.getElementById("app");
const SHAPES=['<path class="sh s1" fill-rule="evenodd" d="M70 385a140 140 0 1 0 280 0a140 140 0 1 0 -280 0ZM84 335a76 76 0 1 0 152 0a76 76 0 1 0 -152 0Z"/>','<polygon class="sh s2" points="352,281 515,432 417,538 254,386"/>','<polygon class="sh s3" points="176,587 132,748 316,718"/>','<circle class="sh s4" cx="330" cy="755" r="76"/>','<polygon class="sh s5" points="351,610 487,577 521,717 385,750"/>','<polygon class="sh s6" points="405,470 587,532 437,660"/>'].join("");
const layer=c=>`<svg class="${c}" viewBox="0 0 640 800" preserveAspectRatio="xMidYMid slice" focusable="false"><rect class="bg" width="640" height="800"/>${SHAPES}</svg>`;
document.getElementById("art").innerHTML=layer("l1")+layer("l2")+'<div class="wash"></div>';
const THEMES=["Ashes", "Deep Blue", "Violet", "Crimson", "Forest", "Ember", "Pearl"];
document.getElementById("themes").innerHTML=THEMES.map((t,i)=>`<button data-th="${i+1}" aria-pressed="false"><span class="dot"></span>${t}</button>`).join("");
function setTheme(n){S.theme=n;save();const go=()=>applyTheme();if(document.startViewTransition&&!matchMedia("(prefers-reduced-motion:reduce)").matches){document.startViewTransition(go)}else go()}
function applyTheme(){const n=(S.theme>=1&&S.theme<=THEMES.length)?S.theme:1;document.documentElement.dataset.art=n;document.querySelectorAll("[data-th]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.th===n)));const a=document.querySelector('[data-th][aria-pressed="true"]');if(a&&a.parentNode.scrollTo)a.parentNode.scrollTo({left:a.offsetLeft-16,behavior:"smooth"})}
const reps=()=>(PROG.find(p=>p[0]===S.week)||PROG[0])[1];
const getL=(w,d)=>((S.logs["w"+w]||{})[DAYS[d]])||{};
const setL=(d,i,v)=>{const k="w"+S.week;S.logs[k]=S.logs[k]||{};S.logs[k][DAYS[d]]=S.logs[k][DAYS[d]]||{};S.logs[k][DAYS[d]][i]=Math.max(0,Math.min(10,v));save()};
const total=(w,d)=>Object.values(getL(w,d)).reduce((a,b)=>a+(+b||0),0);
const met=(w,d)=>total(w,d)>=S.goal;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TABS=[["today","Today"],["plan","Plan"],["guide","Guide"],["progress","Progress"],["settings","Settings"]];
function nav(){document.getElementById("nav").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':""}>${l}</button>`).join("")}
function ring(t){const R=56,C=2*Math.PI*R,f=Math.min(1,t/S.goal);return `<div class="ring" role="img" aria-label="${t} of ${S.goal} rounds done"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--accent-soft)" stroke-width="14"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}"/></svg><div class="num"><div>${t}/${S.goal}<small>rounds</small></div></div></div>`}
function today(){
const [focus,ex]=PLAN[sel],t=total(S.week,sel),L=getL(S.week,sel);
let h=`<div class="daytabs" role="group" aria-label="Choose day">${DAYS.map((d,i)=>`<button data-day="${i}" aria-pressed="${i===sel}">${d}</button>`).join("")}</div>`;
if(!ex.length)return h+`<div class="card"><h2>Rest day</h2><p>Recover today. An easy 15-20 minute walk is optional.</p></div>`;
h+=`<div class="hero">${ring(t)}<div><h2>${DAYS[sel]}: ${focus}</h2><p>Week ${S.week}: ${reps()} slow reps per round. Do each move once, or one move ${S.goal} times.</p>${t>=S.goal?`<div class="met" role="status">Goal met! ${t} rounds done today. Nice, clean work.</div>`:""}</div></div>`;
h+='<div class="exlist">'+ex.map((n,i)=>{const v=+L[i]||0,o=open===i;return `<div class="card ex"><div class="name"><b>${esc(n)}</b><span>${reps()} reps per round</span></div><div class="counter" role="group" aria-label="Rounds of ${esc(base(n))}"><button data-dec="${i}" aria-label="Remove a round of ${esc(base(n))}">−</button><output aria-live="polite">${v}</output><button class="plus" data-inc="${i}" aria-label="Add a round of ${esc(base(n))}">+</button></div><button class="linkbtn" data-cue="${i}" aria-expanded="${o}">${o?"Hide form cue":"Form cue"}</button>${o?`<div class="cue">${esc(cueFor(n))}</div>`:""}</div>`}).join("")+'</div>';
return h}
function plan(){
const cur=(new Date().getDay()+6)%7;
return `<div class="lst plist">${PLAN.map(([f,ex],i)=>`<button class="it prow${ex.length?"":" rest"}${i===cur?" now":""}" data-open="${i}"><span class="pd">${DAYS[i]}</span><span class="pf">${f}</span><span class="px">${ex.length?ex.map(n=>`<i>${esc(n)}</i>`).join(""):"<i>Optional 15-20 minute walk</i>"}</span></button>`).join("")}</div><div class="card tipcard"><h3>Tips</h3><ul class="tips">${TIPS.map(t=>`<li>${t}</li>`).join("")}</ul></div>`}
function guide(){
const q=(document.getElementById("q")||{}).value||"";
const items=Object.entries(CUES).filter(([n,c])=>(n+c).toLowerCase().includes(q.toLowerCase()));
return `<div class="card"><label for="q">Search exercises</label><input id="q" type="search" value="${esc(q)}" placeholder="Try bridge, squat, kick"></div><div id="gl">${gl(items)}</div>`}
const gl=items=>items.length?items.map(([n,c])=>`<div class="card"><h3>${n}</h3><p style="margin:6px 0 0">${c}</p></div>`).join(""):`<div class="card">No exercises match. Try a shorter word.</div>`;
function progress(){
let days=0,tot=0;
const dc=[0,1,2,3,4,5].map(d=>{const L=getL(S.week,d),t=total(S.week,d),m=t>=S.goal;if(m)days++;tot+=t;return `<div class="it dc${m?" hit":""}"><b class="dn">${DAYS[d]}</b><span class="pips">${[0,1,2,3,4].map(i=>`<i class="${+L[i]?"on":""}">${+L[i]||0}</i>`).join("")}</span><span class="ds"><b>${t}/${S.goal}</b> ${m?"Goal met":"Not yet"}</span></div>`}).join("");
const wk=PROG.map(p=>`<div class="it wk${p[0]===S.week?" cur":""}"><b class="wn">Week ${p[0]}</b><span class="wr">${p[1]} reps per round</span><span class="wt">${p[2]}</span><span class="wa">${p[3]}</span></div>`).join("");
return `<div class="card psec"><h3>Week ${S.week} tracker</h3><p class="msg">Days goal met: <b>${days} of 6</b>. Total rounds this week: <b>${tot}</b>.</p><div class="lst dlist">${dc}</div></div><div class="card psec"><h3>4-week progression</h3><div class="lst wklist">${wk}</div><p class="msg">Week 5 onward: add 2 reps, a slightly heavier load, or a stronger band every 1-2 weeks, never all at once.</p></div>`}
function settings(){
return `<div class="card"><label for="g">Daily goal (rounds)</label><input id="g" type="number" min="1" max="10" value="${S.goal}"><label for="w">Current week</label><select id="w">${PROG.map(p=>`<option value="${p[0]}" ${p[0]===S.week?"selected":""}>Week ${p[0]} (${p[1]} reps)</option>`).join("")}</select><p class="msg">Changing the week keeps earlier logs.</p></div>
<div class="card"><h3>Back up your progress</h3><div class="row"><button class="btn" data-export>Show backup text</button><button class="btn" data-import>Restore from text</button></div><label for="io">Backup text</label><textarea id="io" rows="5" placeholder="Copy this text to save it, or paste a backup here and choose Restore.">${esc(io)}</textarea><p class="msg" id="iom"></p></div>
<div class="card"><h3>Reset</h3><div class="row"><button class="btn" data-resetweek>Reset this week</button><button class="btn danger" data-resetall>Reset all data</button></div></div>`}
function render(){applyTheme();nav();el.innerHTML='<div class="pg '+tab+'">'+({today,plan,guide,progress,settings}[tab]())+"</div>";el.querySelectorAll(".ex").forEach((e,i)=>e.style.viewTransitionName="ex"+i);const hh=el.querySelector(".hero");if(hh)hh.style.viewTransitionName="hero";const dd=el.querySelector(".daytabs");if(dd)dd.style.viewTransitionName="days";[["prow","pr"],["wk","wk"],["dc","dc"],["psec","sec"],["tipcard","tipc"]].forEach(([c,n])=>el.querySelectorAll("."+c).forEach((e,i)=>e.style.viewTransitionName=n+i));if(tab==="settings")document.getElementById("io").value=io}
document.addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.th){setTheme(+d.th);return}
if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}
if(d.day!==undefined){sel=+d.day;open=null;render();return}
if(d.open!==undefined){sel=+d.open;tab="today";open=null;render();return}
if(d.inc!==undefined){const i=+d.inc;setL(sel,i,(+getL(S.week,sel)[i]||0)+1);render();return}
if(d.dec!==undefined){const i=+d.dec;setL(sel,i,(+getL(S.week,sel)[i]||0)-1);render();return}
if(d.cue!==undefined){open=open===+d.cue?null:+d.cue;render();return}
if(d.export!==undefined){io=JSON.stringify(S);document.getElementById("io").value=io;document.getElementById("iom").textContent="Copy the text above and keep it somewhere safe.";return}
if(d.import!==undefined){const m=document.getElementById("iom");try{const p=JSON.parse(document.getElementById("io").value);if(!p||typeof p.logs!=="object"||!p.goal||!p.week)throw 0;S=Object.assign({goal:5,week:1,logs:{}},p);save();m.textContent="Progress restored.";}catch(x){m.textContent="That text isn’t a valid backup. Paste the full text you copied earlier."}return}
if(d.resetweek!==undefined){if(confirm("Clear all logs for week "+S.week+"?")){delete S.logs["w"+S.week];save();render()}return}
if(d.resetall!==undefined){if(confirm("Delete all logs and settings?")){S={goal:5,week:1,logs:{}};save();render()}return}
});
document.addEventListener("input",e=>{
if(e.target.id==="q"){const q=e.target.value.toLowerCase();document.getElementById("gl").innerHTML=gl(Object.entries(CUES).filter(([n,c])=>(n+c).toLowerCase().includes(q)))}
});
document.addEventListener("change",e=>{
if(e.target.id==="g"){const v=Math.max(1,Math.min(10,parseInt(e.target.value)||5));S.goal=v;e.target.value=v;save()}
if(e.target.id==="w"){S.week=+e.target.value;save()}
});
render();
</script>
</body>
</html>
